<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | SAMAHA CAPITAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A227;
            --gold-light: #E8D48B;
            --gold-dark: #A67C00;
            --card: #1C1C1C;
            --gray: #2A2A2A;
            --white: #FFFFFF;
            --blue: #7EB6FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(160deg, #0A0A0A 0%, #151515 50%, #0A0A0A 100%);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.6;
        }
        .top-bar {
            background: rgba(10,10,10,0.97);
            border-bottom: 1px solid rgba(201,162,39,0.3);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .brand { font-size: 16px; font-weight: 800; color: var(--gold); }
        .top-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            background: transparent;
            border: 1.5px solid var(--gold);
            color: var(--gold);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: rgba(201,162,39,0.12); }
        .btn.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #111;
            border: none;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 50px; }
        .login-box {
            max-width: 380px;
            margin: 80px auto;
            background: var(--card);
            border: 1px solid rgba(201,162,39,0.3);
            border-radius: 18px;
            padding: 32px 28px;
            text-align: center;
        }
        .login-box h2 { color: var(--gold); margin-bottom: 8px; font-size: 22px; }
        .login-box p { color: #999; font-size: 13px; margin-bottom: 22px; }
        .login-box input {
            width: 100%;
            background: var(--gray);
            border: 1.5px solid #3A3A3A;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            color: #fff;
            outline: none;
            margin-bottom: 14px;
            text-align: center;
        }
        .login-box input:focus { border-color: var(--gold); }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
        }
        .stat-card .num { font-size: 28px; font-weight: 800; color: var(--gold); }
        .stat-card .label { font-size: 12px; color: #999; margin-top: 4px; }
        .filters {
            background: var(--card);
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filters input, .filters select {
            background: var(--gray);
            border: 1.5px solid #3A3A3A;
            border-radius: 10px;
            padding: 9px 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 13.5px;
            color: #fff;
            outline: none;
        }
        .filters input:focus, .filters select:focus { border-color: var(--gold); }
        .filters input { flex: 1; min-width: 180px; }
        .filters select { min-width: 140px; }
        .table-wrap {
            background: var(--card);
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 14px;
            overflow: hidden;
        }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: rgba(201,162,39,0.1);
            color: var(--gold-light);
            font-weight: 700;
            text-align: right;
            padding: 12px 14px;
            white-space: nowrap;
            border-bottom: 1px solid rgba(201,162,39,0.2);
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #DDD;
            vertical-align: top;
        }
        tr:hover td { background: rgba(201,162,39,0.05); }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge.prop { background: rgba(201,162,39,0.2); color: var(--gold); }
        .badge.mgmt { background: rgba(100,200,120,0.2); color: #7DDB8E; }
        .badge.legal { background: rgba(100,160,255,0.2); color: var(--blue); }
        .badge.status-new { background: rgba(255,180,50,0.2); color: #FFB432; }
        .badge.status-done { background: rgba(80,200,120,0.2); color: #50C878; }
        .badge.status-progress { background: rgba(100,160,255,0.2); color: var(--blue); }
        .empty { text-align: center; padding: 50px 20px; color: #777; }
        .loading { text-align: center; padding: 60px 20px; color: var(--gold); font-size: 15px; }
        .detail-row { display: none; }
        .detail-row.open { display: table-row; }
        .detail-cell {
            background: rgba(0,0,0,0.35);
            padding: 14px 18px !important;
            font-size: 12.5px;
            color: #BBB;
            line-height: 1.8;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            text-decoration: underline;
        }
        .wa-link { color: #25D366; text-decoration: none; font-weight: 600; }
        .error-box {
            background: rgba(255,80,80,0.1);
            border: 1px solid rgba(255,80,80,0.3);
            border-radius: 12px;
            padding: 16px;
            color: #FF8A8A;
            margin-bottom: 20px;
            font-size: 13.5px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2>لوحة التحكم</h2>
        <p>SAMAHA CAPITAL — إدارة الطلبات</p>
        <input type="password" id="adminPass" placeholder="كلمة المرور" autocomplete="off">
        <button class="btn primary" style="width:100%; justify-content:center; padding:12px;" onclick="tryLogin()">دخول</button>
        <p style="margin-top:16px; font-size:11px; color:#666;">الوصول للإدارة فقط</p>
    </div>
</div>

<div id="dashboard" class="hidden">
    <div class="top-bar">
        <div class="brand">SAMAHA CAPITAL — لوحة التحكم</div>
        <div class="top-actions">
            <button class="btn" onclick="loadData()">↻ تحديث</button>
            <a class="btn" href="index.html">النموذج</a>
            <button class="btn" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="container">
        <div class="stats" id="stats">
            <div class="stat-card"><div class="num" id="sTotal">—</div><div class="label">إجمالي الطلبات</div></div>
            <div class="stat-card"><div class="num" id="sProp">—</div><div class="label">تسجيل عقارات</div></div>
            <div class="stat-card"><div class="num" id="sMgmt">—</div><div class="label">إدارة أملاك</div></div>
            <div class="stat-card"><div class="num" id="sLegal">—</div><div class="label">استشارات قانونية</div></div>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="بحث بالاسم أو الموبايل أو رقم الطلب..." oninput="renderTable()">
            <select id="filterType" onchange="renderTable()">
                <option value="">كل الأنواع</option>
                <option value="تسجيل عقار">تسجيل عقار</option>
                <option value="إدارة أملاك">إدارة أملاك</option>
                <option value="استشارة قانونية">استشارة قانونية</option>
            </select>
            <select id="filterStatus" onchange="renderTable()">
                <option value="">كل الحالات</option>
                <option value="New">جديد</option>
                <option value="In Progress">قيد المتابعة</option>
                <option value="Done">تم</option>
            </select>
        </div>

        <div id="errorBox" class="error-box hidden"></div>
        <div id="loading" class="loading">جاري تحميل الطلبات...</div>

        <div class="table-wrap hidden" id="tableWrap">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>رقم الطلب</th>
                            <th>التاريخ</th>
                            <th>النوع</th>
                            <th>الاسم</th>
                            <th>الموبايل</th>
                            <th>التفاصيل</th>
                            <th>الحالة</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="emptyState" class="empty hidden">لا توجد طلبات مطابقة</div>
        </div>
    </div>
</div>

<script>
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzfFT0bUZH6aGyXCWtrlFKfn4YrhEEFLMbkl62-x7CCQYcTU93j0AcvFQBhwabbdXwpIg/exec";
    const ADMIN_PASSWORD = "Aahmed143@#";

    let allRows = [];

    function tryLogin() {
        const pass = document.getElementById('adminPass').value;
        if (pass === ADMIN_PASSWORD) {
            sessionStorage.setItem('samaha_admin', '1');
            showDashboard();
        } else {
            alert('كلمة المرور غير صحيحة');
        }
    }

    function logout() {
        sessionStorage.removeItem('samaha_admin');
        location.reload();
    }

    function showDashboard() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadData();
    }

    if (sessionStorage.getItem('samaha_admin') === '1') {
        showDashboard();
    }

    document.getElementById('adminPass').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') tryLogin();
    });

    async function loadData() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('tableWrap').classList.add('hidden');
        document.getElementById('errorBox').classList.add('hidden');

        try {
            const res = await fetch(SHEETS_URL);
            const json = await res.json();

            if (!json.success) throw new Error(json.error || 'فشل التحميل');

            allRows = json.rows || [];
            updateStats();
            renderTable();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('tableWrap').classList.remove('hidden');
        } catch (err) {
            console.error(err);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('errorBox').classList.remove('hidden');
            document.getElementById('errorBox').textContent =
                'تعذر تحميل البيانات. التفاصيل: ' + err.message;
        }
    }

    function updateStats() {
        const total = allRows.length;
        const prop = allRows.filter(r => {
            const t = (r['Request Type'] || r.type || '').toString();
            return t.includes('عقار') || t === 'تسجيل عقار';
        }).length;
        const mgmt = allRows.filter(r => {
            const t = (r['Request Type'] || r.type || '').toString();
            return t.includes('أملاك') || t === 'إدارة أملاك';
        }).length;
        const legal = allRows.filter(r => {
            const t = (r['Request Type'] || r.type || '').toString();
            return t.includes('قانونية') || t.includes('استشارة');
        }).length;

        document.getElementById('sTotal').textContent = total;
        document.getElementById('sProp').textContent = prop;
        document.getElementById('sMgmt').textContent = mgmt;
        document.getElementById('sLegal').textContent = legal;
    }

    function getVal(row, ...keys) {
        for (const k of keys) {
            if (row[k] !== undefined && row[k] !== null && row[k] !== '') return row[k];
        }
        return '';
    }

    function typeBadge(type) {
        const t = String(type || '');
        if (t.includes('أملاك') || t.includes('إدارة')) return '<span class="badge mgmt">إدارة أملاك</span>';
        if (t.includes('قانونية') || t.includes('استشارة')) return '<span class="badge legal">استشارة قانونية</span>';
        return '<span class="badge prop">تسجيل عقار</span>';
    }

    function statusBadge(status) {
        const s = (status || 'New').toString();
        if (s === 'Done' || s === 'تم') return '<span class="badge status-done">تم</span>';
        if (s === 'In Progress' || s === 'قيد المتابعة') return '<span class="badge status-progress">قيد المتابعة</span>';
        return '<span class="badge status-new">جديد</span>';
    }

    function renderTable() {
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        const typeF = document.getElementById('filterType').value;
        const statusF = document.getElementById('filterStatus').value;

        let rows = allRows.filter(r => {
            const type = getVal(r, 'Request Type', 'type');
            const status = getVal(r, 'Status', 'status') || 'New';
            const name = getVal(r, 'Full Name', 'name');
            const phone = getVal(r, 'Mobile', 'phone');
            const id = getVal(r, 'Request ID', 'id');

            if (typeF) {
                if (typeF === 'تسجيل عقار' && !String(type).includes('عقار')) return false;
                if (typeF === 'إدارة أملاك' && !String(type).includes('أملاك')) return false;
                if (typeF === 'استشارة قانونية' && !String(type).includes('قانونية') && !String(type).includes('استشارة')) return false;
            }
            if (statusF && status !== statusF) return false;
            if (q) {
                const hay = (String(id) + ' ' + String(name) + ' ' + String(phone) + ' ' + String(type)).toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        });

        const tbody = document.getElementById('tableBody');
        const empty = document.getElementById('emptyState');

        if (rows.length === 0) {
            tbody.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        tbody.innerHTML = rows.map((r, idx) => {
            const id = getVal(r, 'Request ID', 'id') || '—';
            const date = getVal(r, 'Date', 'date') || '—';
            const type = getVal(r, 'Request Type', 'type');
            const name = getVal(r, 'Full Name', 'name') || '—';
            const phone = getVal(r, 'Mobile', 'phone') || '';
            const status = getVal(r, 'Status', 'status') || 'New';

            const offer = getVal(r, 'Offer Type', 'offerType');
            const propType = getVal(r, 'Property Type', 'propertyType');
            const gov = getVal(r, 'Governorate', 'governorate');
            const area = getVal(r, 'Area', 'area');
            const package_ = getVal(r, 'Package', 'package');
            const notes = getVal(r, 'Notes', 'notes') || getVal(r, 'Management Notes', 'mgmtNotes');
            const email = getVal(r, 'Email', 'email');
            const city = getVal(r, 'City', 'city');
            const isExpat = getVal(r, 'Is Expat', 'isExpat');
            const expatCountry = getVal(r, 'Expat Country', 'expatCountry');
            const price = getVal(r, 'Price', 'price');
            const address = getVal(r, 'Address', 'address');

            let details = '';
            if (offer || propType) details += `العرض: ${offer || '—'} | النوع: ${propType || '—'}<br>`;
            if (gov || area) details += `المكان: ${gov || ''} ${area || ''}<br>`;
            if (price) details += `السعر: ${price}<br>`;
            if (address) details += `العنوان: ${address}<br>`;
            if (package_) details += `الباقة: ${package_}<br>`;
            if (isExpat) details += `مغترب: ${isExpat} ${expatCountry || ''}<br>`;
            if (email) details += `إيميل: ${email}<br>`;
            if (city) details += `المدينة: ${city}<br>`;
            if (notes) details += `ملاحظات: ${notes}`;

            const phoneStr = String(phone == null ? '' : phone).trim();
            const wa = phoneStr ? `<a class="wa-link" href="https://wa.me/2${phoneStr.replace(/^0/, '')}" target="_blank">${phoneStr}</a>` : '—';

            return `
                <tr>
                    <td><strong style="color:var(--gold)">${id}</strong></td>
                    <td style="white-space:nowrap;font-size:12px">${date}</td>
                    <td>${typeBadge(type)}</td>
                    <td>${name}</td>
                    <td>${wa}</td>
                    <td style="max-width:200px;font-size:12px;color:#AAA">${(offer || propType || package_ || '—').toString().slice(0,40)}</td>
                    <td>${statusBadge(status)}</td>
                    <td><button class="toggle-btn" onclick="toggleDetail(${idx})">المزيد</button></td>
                </tr>
                <tr class="detail-row" id="detail-${idx}">
                    <td colspan="8" class="detail-cell">${details || 'لا توجد تفاصيل إضافية'}</td>
                </tr>
            `;
        }).join('');
    }

    function toggleDetail(idx) {
        const row = document.getElementById('detail-' + idx);
        if (row) row.classList.toggle('open');
    }
</script>
</body>
</html>
